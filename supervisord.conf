[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:dataservice]
command=npm start
directory=/app/DataService
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/dataservice-stdout.log
stderr_logfile=/var/log/supervisor/dataservice-stderr.log
environment=NODE_ENV="production",PORT="3100",no_proxy="localhost,127.0.0.1,172.17.0.0/16"

[program:backend]
command=python3 app.py
directory=/app/Backend
autostart=true
autorestart=true
startsecs=8
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/backend-stdout.log
stderr_logfile=/var/log/supervisor/backend-stderr.log
environment=no_proxy="localhost,127.0.0.1,172.17.0.0/16"
